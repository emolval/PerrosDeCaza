<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
</head>
<body>
    <h2 style="text-align: center;">Contáctanos</h2>

    <form action="" method="POST" enctype="multipart/form-data">

        <label for="nombre">Nombre Completo:</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">

        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}" placeholder="123456789">

        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" name="direccion" placeholder="Tu dirección">

        <label for="motivo">Motivo del contacto:</label>
        <select id="motivo" name="motivo">
            <option value="informacion">Solicitud de información</option>
            <option value="reclamo">Reclamo</option>
            <option value="sugerencia">Sugerencia</option>
            <option value="otro">Otro</option>
        </select>

        <label>¿Cómo prefieres que te contactemos?</label>
        <input type="radio" id="contacto_email" name="contacto" value="email" checked>
        <label for="contacto_email">Email</label>
        <input type="radio" id="contacto_telefono" name="contacto" value="telefono">
        <label for="contacto_telefono">Teléfono</label>

        <label for="mensaje">Escribe tu mensaje:</label>
        <textarea id="mensaje" name="mensaje" rows="4" required placeholder="Tu consulta aquí..."></textarea>

        <label for="archivo">Adjuntar archivo (opcional):</label>
        <input type="file" id="archivo" name="archivo" accept=".jpg, .png, .pdf">

        <input type="checkbox" id="terminos" name="terminos" required>
        <label for="terminos">Acepto los términos y condiciones</label>

        <button type="submit">Enviar</button>
    </form>

</body>
</html>
